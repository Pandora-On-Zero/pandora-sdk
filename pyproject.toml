[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-sdk"
version = "0.1.0"
description = "Hands from the 01 Glove app in a few lines of Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The message format is pandora-core's, not a copy of it. Pinned to a
    # commit of the private Pandora repo; see README, "Installing".
    "pandora-core @ git+https://github.com/Pandora-On-Zero/Pandora.git@3932fe6cd4b0a2d8764e6550575f780c0a33397c#subdirectory=pandora-core",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pandora = "pandora_sdk.cli:main"

[tool.setuptools]
packages = ["pandora_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
