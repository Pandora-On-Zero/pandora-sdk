[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-sdk"
version = "0.3.1"
description = "Hands from the 01 Glove app in a few lines of Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The message format and the pipeline are pandora-core-rs's (the Rust core's
    # Python binding), not a copy of them: one prebuilt wheel per platform from a
    # Pandora-Release release; see README, "Installing".
    "pandora-core-rs @ https://github.com/Pandora-On-Zero/Pandora-Release/releases/download/core-rs-v0.2.0/pandora_core_rs-0.2.0-cp311-abi3-win_amd64.whl#sha256=3481563db74843577baf2fd0e6a1b38e40aabfe060381f6b48b220781584bb8e ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "pandora-core-rs @ https://github.com/Pandora-On-Zero/Pandora-Release/releases/download/core-rs-v0.2.0/pandora_core_rs-0.2.0-cp311-abi3-manylinux_2_28_x86_64.whl#sha256=868696e348b1e90fe1405688ceee47afe17842a78eb1c31ae2f64346d5475c81 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pandora-core-rs @ https://github.com/Pandora-On-Zero/Pandora-Release/releases/download/core-rs-v0.2.0/pandora_core_rs-0.2.0-cp311-abi3-manylinux_2_28_aarch64.whl#sha256=3e646b677becd18ba971e76ba786920ef7d18cfeac3c9b8adb3139cdf5e8cfb3 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "pandora-core-rs @ https://github.com/Pandora-On-Zero/Pandora-Release/releases/download/core-rs-v0.2.0/pandora_core_rs-0.2.0-cp311-abi3-macosx_10_12_universal2.macosx_10_12_x86_64.macosx_11_0_arm64.whl#sha256=a042d51551546a22b3689d335560abbc0c3cdab53a4b3d24b44e683230d70a2c ; sys_platform == 'darwin'",
    # The receiver's port (pandora_core_rs.receiver).
    "pyserial>=3.5",
    "websockets>=13",
]

[project.optional-dependencies]
# msgpack: tests/standin.py decodes the binary messages on its own.
dev = ["pytest>=8", "msgpack>=1.0"]

[project.scripts]
pandora = "pandora_sdk.cli:main"

[tool.setuptools]
packages = ["pandora_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
