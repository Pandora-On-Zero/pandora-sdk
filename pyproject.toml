[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-sdk"
version = "0.2.1"
description = "Hands from the 01 Glove app in a few lines of Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The message format is pandora-core's, not a copy of it. Pinned to a
    # commit of the private Pandora repo; see README, "Installing". The core's
    # base install is only its wire layer: `pipeline` brings numpy for the hand
    # pipeline (Glove, calibration), `serial` brings pyserial for the receiver.
    "pandora-core[pipeline,serial] @ git+https://github.com/Pandora-On-Zero/Pandora.git@43ffd5e8c68314cf84ad792ad878187f80248261#subdirectory=pandora-core",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pandora = "pandora_sdk.cli:main"

[tool.setuptools]
packages = ["pandora_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
