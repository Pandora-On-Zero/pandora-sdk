[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-sdk"
version = "0.4.1"
description = "Hands from the 01 Glove app in a few lines of Python"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    # The message format and the pipeline are pandora-core-rs's (the Rust core's
    # Python binding, prebuilt wheels on PyPI), not a copy of them.
    "pandora-core-rs>=0.2.3,<0.3",
    # The receiver's port (pandora_core_rs.receiver).
    "pyserial>=3.5",
    "websockets>=13",
]

[project.urls]
Source = "https://github.com/Pandora-On-Zero/pandora-sdk-python"
Changelog = "https://github.com/Pandora-On-Zero/pandora-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# msgpack: tests/standin.py decodes the binary messages on its own.
dev = ["pytest>=8", "msgpack>=1.0"]

[project.scripts]
pandora = "pandora_sdk.cli:main"

[tool.setuptools]
packages = ["pandora_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
